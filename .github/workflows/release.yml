# Publish to PyPI on a version tag, using an API token stored as an
# environment secret.
#
# v0.3.0 was published by hand (the pending-publisher registration Trusted
# Publishing needs was never completed, and publishing could not wait), which
# spends this workflow's original design -- OIDC, no token stored anywhere.
# Token-based auth is the fallback PyPI itself documents for exactly this
# case. The token is scoped to the `pypi` GitHub Environment rather than a
# bare repository secret, so only a job that declares `environment: pypi`
# (below) can read it -- the same blast-radius argument that motivated OIDC
# in the first place, just with a token instead of a short-lived credential.
#
# One-time setup, both on pypi.org:
#   1. Log in, then Account settings -> API tokens -> Add API token.
#      Scope it to the mtb-resistotyper-ml project specifically (it has a
#      release now, so a project-scoped token is available) rather than to
#      the whole account.
#   2. Store it as an environment secret, not a repo secret, so only this
#      workflow's `pypi`-environment job can see it:
#        gh secret set PYPI_API_TOKEN --repo abhi18av-phd-projects/mtb-resistotyper-ml --env pypi
#      Run from your own terminal -- the token should never pass through an
#      agent or a chat transcript.
#
# Trusted Publishing remains the better long-term mechanism (no stored
# secret, nothing to rotate or leak) and can still be set up later; doing so
# needs no change here beyond removing the `with: password:` line below, so
# switching back is one line whenever the pending-publisher registration
# actually gets done.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build
      - run: python -m build
      # A wheel that does not import is not worth publishing. This is the same
      # bare-install check that caught an unsatisfiable extra before release.
      - name: bare install imports and runs
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install --quiet dist/*.whl
          /tmp/bare/bin/python -c "import mtb_resistotyper_ml as m; print(m.__version__)"
          /tmp/bare/bin/mtb-resistotyper-ml --help > /dev/null
      - name: extras resolve
        run: |
          python -m venv /tmp/full
          /tmp/full/bin/pip install --quiet "$(ls dist/*.whl)[all]"
          /tmp/full/bin/python -c "import gumpy, piezo; print('extras OK')"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi        # gates access to the PYPI_API_TOKEN environment secret
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
