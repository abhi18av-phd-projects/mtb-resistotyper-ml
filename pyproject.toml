[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtb-resistotyper-ml"
dynamic = ["version"]
description = "Runner for versioned Mycobacterium tuberculosis drug-resistance models that declare their own operating range"
readme = "README.md"
requires-python = ">=3.10"
license = "EPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Abhinav Sharma", email = "abhi18av@outlook.com" }]
keywords = [
  "antimicrobial resistance", "tuberculosis", "machine learning",
  "genomics", "model distribution", "lineage-aware evaluation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Eclipse Public License 2.0 (EPL-2.0)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Deliberately empty, and it still is. Scoring a deployed bundle is a closed form
# over the standard library, and `import mtb_resistotyper_ml` pulls in nothing.
# The two capabilities that DO need third-party code import it lazily and fail
# with an explanation, so a bare install is useful rather than broken.
dependencies = []

[project.optional-dependencies]
# Layer 1, the curated WHO catalogue. piezo's latest release is 0.9.2; an earlier
# `>=1.0` here was unsatisfiable and made the extra uninstallable.
catalogue = ["piezo>=0.9"]
# Reading a VCF: gumpy converts genome coordinates to gene-anchored GARC names and
# brings biopython with it. NOT sufficient on its own — bcftools must be on PATH,
# which pip cannot supply; see the README.
vcf = ["gumpy>=1.3"]
all = ["mtb-resistotyper-ml[catalogue,vcf]"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mtb-resistotyper-ml = "mtb_resistotyper_ml.cli:main"

[project.urls]
Homepage = "https://github.com/abhi18av-phd-projects/mtb-resistotyper-ml"
Models = "https://github.com/abhi18av-phd-projects/mtb-resistotyper-ml-models"

[tool.hatch.build.targets.wheel]
packages = ["src/mtb_resistotyper_ml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test the tree, not whatever copy happens to be installed. Without this a stale
# site-packages install shadows src/ and the suite reports failures that describe
# the old code rather than this one.
pythonpath = ["src"]

[tool.hatch.version]
# Single source: the package states its own version and the wheel follows.
# A hand-kept duplicate in pyproject drifts, and a wheel whose metadata
# disagrees with __version__ is a provenance bug on PyPI.
path = "src/mtb_resistotyper_ml/version.py"
