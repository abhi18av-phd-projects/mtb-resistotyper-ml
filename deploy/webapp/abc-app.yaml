# mtb-resistotyper-ml prediction service.
#
# Layer 2 only: these models are meant to fire where a curated WHO catalogue
# returns Unknown or Fail, and this service consults no catalogue. Every call it
# makes is therefore a model call, and it labels each one as such rather than
# leaving the reader to infer it.
version: "1.0"
name: mtb-resistotyper
project: mbhg-bioinformatics
framework: custom

# Built by deploy/webapp/bring-up.sh. "aither.local" is the platform's
# local-image naming convention, not a live registry: docker push always fails.
image: aither.local/mtb-resistotyper-webapp:v0.2.0

port: 8080
health: /health

# Public, so that the models described in the manuscript can be exercised by a
# reviewer or a reader without cluster access. That reach is the reason the
# page and every download state, unprompted, that these are Layer 2 model calls
# from models with no prospective validation, and that no curated catalogue was
# consulted. A reader who arrives from a search engine rather than from the
# paper has to be told the same thing the paper tells them.
access: team
expose: [public, shared, private]

resources:
  cpu: 1000      # MHz — gumpy's genome diff dominates; scoring is arithmetic
  memory: 6144   # MiB — a parsed H37Rv genome plus the piezo catalogue

env:
  MTB_MODELS: /opt/models
  MTB_REFERENCE_GENBANK: /opt/reference/NC_000962.3.gbk
  MTB_CATALOGUE: /opt/catalogue/NC_000962.3_WHO-UCN-TB-2023.5_v2.1_GARC1_RFUS.csv
  MTB_BUCKET: su-mbhg-bioinformatics
  # Where uploads land. `abc data upload` writes under user/<slot>/; the tusd
  # mover writes user/<slot>/data/. The service refuses any key outside these,
  # so a prediction endpoint cannot be used as a general read oracle for the
  # group bucket.
  MTB_PREFIXES: "user/abhinav/,users/abhi/,shared/"

# Read-only: this service reads what a researcher already uploaded and writes
# nothing back. Results are returned to the browser, not deposited in the bucket.
data:
  - bucket: su-mbhg-bioinformatics
    access: read
