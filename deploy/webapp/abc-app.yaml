# mtb-resistotyper-ml prediction service.
#
# Two layers. The curated WHO catalogue (MTB_CATALOGUE below) grades what it
# can, and a model answers only where the catalogue grades no mutation for that
# drug. Every call names which layer made it, rather than leaving the reader to
# infer it.
version: "1.0"
name: mtb-resistotyper
project: mbhg-bioinformatics
framework: custom

# Built and pushed by deploy/webapp/bring-up.sh. This is a real registry, so the
# job can place on any node and survives a node rebuild. It previously named
# "aither.local/...", a convention for images already sitting in one host's
# docker daemon: the deploy worked only because that host happened to hold the
# build, and would have placed a job that could never pull anywhere else.
image: ghcr.io/abhi18av-phd-projects/mtb-resistotyper-ml/mtb-resistotyper-webapp:v0.2.10

port: 8080
health: /health

# Public, so that the models described in the manuscript can be exercised by a
# reviewer or a reader without cluster access. That reach is the reason the
# page and every download state, unprompted, which layer answered each call,
# which catalogue edition Layer 1 used, and that the model calls come from
# models with no prospective validation. A reader who arrives from a search
# engine rather than from the paper has to be told the same thing the paper
# tells them.
access: team
expose: [public, shared, private]

resources:
  cpu: 1000      # MHz — gumpy's genome diff dominates; scoring is arithmetic
  memory: 6144   # MiB — a parsed H37Rv genome plus the piezo catalogue

env:
  MTB_MODELS: /opt/models
  MTB_REFERENCE_GENBANK: /opt/reference/NC_000962.3.gbk
  MTB_CATALOGUE: /opt/catalogue/NC_000962.3_WHO-UCN-TB-2023.5_v2.1_GARC1_RFUS.csv
  MTB_BUCKET: su-mbhg-bioinformatics
  # Where uploads land. `abc data upload` writes under user/<slot>/; the tusd
  # mover writes user/<slot>/data/. The service refuses any key outside these,
  # so a prediction endpoint cannot be used as a general read oracle for the
  # group bucket.
  MTB_PREFIXES: "user/abhinav/,users/abhi/,shared/,anon-uploads/,demo/"

  # Enumeration is a separate permission from reading, and the dangerous one:
  # object keys in a research group's bucket routinely carry sample and patient
  # identifiers, so listing them discloses who was sequenced even when nothing is
  # read. Left empty, /objects returns 403. Set it only to a curated demo prefix
  # on a publicly reachable deployment.
  # Enabled for two prefixes, both of which disclose nothing. demo/ holds the
  # generated synthetic isolates in deploy/webapp/demo -- no real sample is in
  # it, so the whole prefix is safe to enumerate, and without it the dropdown on
  # a fresh deployment is empty and the service demonstrates nothing.
  # anon-uploads/ holds files testers put through this app themselves, on short
  # store-enforced retention. The real data prefixes stay unlistable: readable
  # by key, never enumerable.
  MTB_LIST_PREFIXES: "demo/,anon-uploads/"

  # Anonymous uploads: a deliberate testing affordance. Nobody knows who uploaded
  # an anonymous clinical VCF or under what basis, so there is no one to ask and
  # no consent recorded. Retention is therefore short and enforced by the object
  # store, not promised by the application.
  MTB_ANON_UPLOADS: "1"
  MTB_ANON_PREFIX: "anon-uploads/"
  MTB_ANON_RETENTION_HOURS: "24"
  MTB_ANON_MAX_BYTES: "67108864"

# Read-write, and only because of anonymous uploads: the service stores them
# under anon-uploads/ so a tester can re-run without re-uploading, and applies
# the bucket lifecycle rule that expires them. Results are still returned to the
# browser rather than deposited in the bucket.
data:
  - bucket: su-mbhg-bioinformatics
    access: read-write
